# ============================================================================
# DevShakti OS — systemd-boot Boot Entry
# ============================================================================
# Boot entry for the DevShakti OS live environment via systemd-boot (UEFI).
#
# Kernel parameters:
#   - quiet splash        → Suppress verbose boot messages; show Plymouth splash
#   - cow_spacesize=2G    → Increase overlay FS size for live session writes
#   - copytoram=n         → Don't copy squashfs to RAM (saves memory)
#   - nvidia-drm.modeset=1 → Enable NVIDIA kernel modesetting for Wayland
#   - amd_pstate=active   → Use AMD P-State driver for Ryzen 7 power management
#
# Copyright (c) 2026 DevShakti Project
# SPDX-License-Identifier: MIT
# ============================================================================

title    🔱 DevShakti OS (Live)
linux    /arch/boot/x86_64/vmlinuz-linux-zen
initrd   /arch/boot/amd-ucode.img
initrd   /arch/boot/x86_64/initramfs-linux-zen.img
options  archisobasedir=arch archisolabel=DEVSHAKTI_%C quiet splash cow_spacesize=2G nvidia-drm.modeset=1 amd_pstate=active
