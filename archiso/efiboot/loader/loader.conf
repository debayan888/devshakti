# ============================================================================
# DevShakti OS — systemd-boot Loader Configuration
# ============================================================================
# This file configures the systemd-boot (formerly gummiboot) bootloader
# used for UEFI booting from the live ISO media.
#
# Placed at: /loader/loader.conf on the EFI System Partition
#
# Copyright (c) 2026 DevShakti Project
# SPDX-License-Identifier: MIT
# ============================================================================

# Time in seconds to display the boot menu before auto-selecting the default.
# Set to 0 to boot immediately, or "menu-force" to always show the menu.
timeout 3

# Default boot entry (matches filename in loader/entries/ without .conf)
default devshakti.conf

# Use a simple text-based console output for maximum compatibility
console-mode auto

# Editor disabled for security — prevents users from modifying kernel params at boot
editor no
