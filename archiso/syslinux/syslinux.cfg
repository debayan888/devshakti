# ============================================================================
# DevShakti OS — Syslinux BIOS Boot Configuration
# ============================================================================
# This config is used for legacy BIOS booting from USB/optical media.
# Syslinux handles MBR and El Torito boot modes.
#
# Copyright (c) 2026 DevShakti Project
# SPDX-License-Identifier: MIT
# ============================================================================

# --- Display Settings --------------------------------------------------------
UI vesamenu.c32
MENU TITLE 🔱 DevShakti OS — Boot Menu
MENU BACKGROUND splash.png
MENU COLOR border        30;44    #40ffffff #a0000000 std
MENU COLOR title         1;36;44  #9033ccff #a0000000 std
MENU COLOR sel           7;37;40  #e0ffffff #20ffffff all
MENU COLOR unsel         37;44    #90ffffff #a0000000 std
MENU COLOR help          37;40    #c0ffffff #a0000000 std
MENU COLOR timeout_msg   37;40    #80ffffff #00000000 std
MENU COLOR timeout       1;37;40  #c0ffffff #00000000 std
MENU COLOR msg07         37;40    #90ffffff #a0000000 std
MENU COLOR tabmsg        31;40    #30ffffff #00000000 std

# Auto-boot timeout (in 1/10th seconds: 50 = 5 seconds)
TIMEOUT 50
# Default entry
DEFAULT devshakti

MENU SEPARATOR

# --- Boot Entries ------------------------------------------------------------

LABEL devshakti
    MENU LABEL ^DevShakti OS (Live)
    MENU DEFAULT
    LINUX /arch/boot/x86_64/vmlinuz-linux-zen
    INITRD /arch/boot/amd-ucode.img,/arch/boot/x86_64/initramfs-linux-zen.img
    APPEND archisobasedir=arch archisolabel=DEVSHAKTI_%ARCHISO_LABEL% quiet splash cow_spacesize=2G nvidia-drm.modeset=1 amd_pstate=active

LABEL devshakti-nvidia
    MENU LABEL DevShakti OS (^NVIDIA dGPU Only)
    LINUX /arch/boot/x86_64/vmlinuz-linux-zen
    INITRD /arch/boot/amd-ucode.img,/arch/boot/x86_64/initramfs-linux-zen.img
    APPEND archisobasedir=arch archisolabel=DEVSHAKTI_%ARCHISO_LABEL% quiet splash cow_spacesize=2G nvidia-drm.modeset=1 amd_pstate=active modprobe.blacklist=amdgpu

LABEL devshakti-safe
    MENU LABEL DevShakti OS (^Safe Mode — No GPU Acceleration)
    LINUX /arch/boot/x86_64/vmlinuz-linux-zen
    INITRD /arch/boot/amd-ucode.img,/arch/boot/x86_64/initramfs-linux-zen.img
    APPEND archisobasedir=arch archisolabel=DEVSHAKTI_%ARCHISO_LABEL% nomodeset cow_spacesize=2G

LABEL devshakti-verbose
    MENU LABEL DevShakti OS (^Verbose — Debug Boot)
    LINUX /arch/boot/x86_64/vmlinuz-linux-zen
    INITRD /arch/boot/amd-ucode.img,/arch/boot/x86_64/initramfs-linux-zen.img
    APPEND archisobasedir=arch archisolabel=DEVSHAKTI_%ARCHISO_LABEL% cow_spacesize=2G nvidia-drm.modeset=1 amd_pstate=active loglevel=7

MENU SEPARATOR

LABEL memtest
    MENU LABEL Run ^Memtest86+ (Memory Test)
    LINUX /boot/memtest86+/memtest.bin

LABEL hdt
    MENU LABEL ^Hardware Detection Tool (HDT)
    COM32 hdt.c32

LABEL reboot
    MENU LABEL ^Reboot
    COM32 reboot.c32

LABEL poweroff
    MENU LABEL ^Power Off
    COM32 poweroff.c32
