# ============================================================================
#  DevShakti OS — Gaming & Performance Kernel Parameters
#  Target Hardware: HP Victus 15 (AMD Ryzen 7 7445HS, RTX 4050)
# ============================================================================
#
#  This file tunes Linux kernel parameters for optimal gaming performance,
#  application compatibility, and network responsiveness. These settings
#  are loaded at boot by systemd-sysctl.service.
#
#  File: /etc/sysctl.d/80-gamecompat.conf
#  Applied by: systemd-sysctl.service (reads /etc/sysctl.d/*.conf at boot)
#  Manual apply: sudo sysctl --system
# ============================================================================


# ============================================================================
#  VIRTUAL MEMORY CONFIGURATION
# ============================================================================

# ---------------------------------------------------------------------------
#  vm.max_map_count = 2147483642
# ---------------------------------------------------------------------------
#  Sets the maximum number of memory-mapped regions (VMAs) a single process
#  can create.
#
#  What it does:
#    - Each call to mmap() creates a VMA (Virtual Memory Area) in the
#      process's address space. This parameter limits the total number
#      of VMAs per process.
#    - The default Linux value is 65530, which is far too low for modern
#      gaming workloads.
#
#  Why this value (2,147,483,642 ≈ INT32_MAX - 5):
#    - Modern game engines (Unreal Engine 5, Unity, CryEngine, idTech)
#      use thousands of memory mappings for textures, shaders, mesh data,
#      audio buffers, and streaming assets.
#    - Wine/Proton (Windows game compatibility layer) uses mmap() heavily
#      to emulate Windows virtual memory semantics. A single AAA game
#      running under Proton can easily create 100,000-500,000+ VMAs.
#    - Vulkan drivers allocate device memory regions via mmap(), and
#      modern renderers with bindless resources can create tens of
#      thousands of mappings.
#    - This value matches Valve's recommendation for Steam Deck / SteamOS
#      and was adopted as the kernel default starting in Linux 6.4.
#    - Setting it to the maximum 32-bit signed integer ensures no game
#      will ever hit the VMA limit, regardless of complexity.
#
#  Symptoms of too-low max_map_count:
#    - Games crash with "mmap failed: Cannot allocate memory" or
#      "Out of memory" despite having free RAM.
#    - Proton games fail to launch or crash during level loading.
#    - Large modded games (Skyrim, Minecraft with mods) crash randomly.
#
#  Performance impact: None. This only sets an upper limit; actual memory
#  usage depends on the application. Unused VMAs consume no resources.
# ---------------------------------------------------------------------------
vm.max_map_count = 2147483642

# ---------------------------------------------------------------------------
#  vm.swappiness = 10
# ---------------------------------------------------------------------------
#  Controls how aggressively the kernel swaps memory pages to disk.
#
#  What it does:
#    - The Linux kernel balances between keeping application data in RAM
#      (anonymous pages) and using RAM for filesystem cache (page cache).
#    - vm.swappiness is a weight that influences this balance:
#        0   = Almost never swap (only to prevent OOM kills)
#        10  = Strongly prefer keeping application pages in RAM
#        60  = Default — balanced between apps and filesystem cache
#        100 = Aggressively swap application pages to make room for cache
#
#  Why 10 for gaming:
#    - Gaming workloads are latency-sensitive. Swapping game memory pages
#      to disk (even an NVMe SSD) introduces multi-millisecond stalls
#      that manifest as frame drops, stuttering, and input lag.
#    - The HP Victus 15 typically has 16-32 GB RAM, which is sufficient
#      for most gaming workloads without swapping.
#    - A value of 10 tells the kernel to strongly prefer evicting
#      filesystem cache (which can be quickly re-read) over swapping
#      out game/application memory.
#    - We don't set it to 0 because some swap usage is beneficial as a
#      safety valve during memory pressure (e.g., alt-tabbing from a
#      game to a browser with many tabs open).
#
#  Note: If using zram (compressed swap in RAM), a higher value (30-60)
#  may be appropriate since "swapping" to zram is fast. DevShakti's
#  default configuration uses zram, but we keep swappiness low for
#  the most conservative gaming experience.
#
#  Performance impact: Reduces swap-induced stutter at the cost of
#  slightly less filesystem cache. Net positive for gaming.
# ---------------------------------------------------------------------------
vm.swappiness = 10


# ============================================================================
#  NETWORK CONFIGURATION
# ============================================================================

# ---------------------------------------------------------------------------
#  net.core.default_qdisc = fq
# ---------------------------------------------------------------------------
#  Sets the default packet queuing discipline to Fair Queueing (FQ).
#
#  What it does:
#    - The queuing discipline (qdisc) controls how outgoing network packets
#      are scheduled and sent. It sits between the network stack and the
#      physical network interface.
#    - FQ (Fair Queueing) implements per-flow scheduling with pacing:
#        • Each network connection (flow) gets its own queue
#        • Packets are sent at a rate that matches the connection's
#          congestion window, preventing bursts
#        • Flows are served in round-robin order, preventing any single
#          connection from monopolizing bandwidth
#
#  Why FQ for gaming:
#    - FQ is the recommended qdisc for use with BBR congestion control
#      (see below). BBR + FQ together provide:
#        • Lower latency than the default pfifo_fast qdisc
#        • Smoother packet pacing (reduces burst-induced bufferbloat)
#        • Better bandwidth utilization on high-speed connections
#    - For online gaming, FQ ensures game packets are sent at a steady
#      rate rather than in bursts, reducing jitter (variance in latency).
#    - Prevents large downloads (game updates, streaming) from starving
#      game traffic by giving each flow fair access to bandwidth.
#
#  Alternatives:
#    - pfifo_fast: Simple FIFO, no flow isolation. Default on most distros.
#    - fq_codel: FQ + Controlled Delay. Good for bufferbloat, but BBR
#      performs its own pacing and works best with plain FQ.
#    - cake: Advanced, good for shaped connections. Overkill for most setups.
#
#  Performance impact: Slight CPU overhead per packet (negligible on
#  modern CPUs). Significantly reduces latency and jitter.
# ---------------------------------------------------------------------------
net.core.default_qdisc = fq

# ---------------------------------------------------------------------------
#  net.ipv4.tcp_congestion_control = bbr
# ---------------------------------------------------------------------------
#  Sets the TCP congestion control algorithm to BBR (Bottleneck Bandwidth
#  and Round-trip propagation time).
#
#  What it does:
#    - Congestion control determines how fast TCP sends data by adjusting
#      the congestion window (cwnd) based on network conditions.
#    - Traditional algorithms (Cubic, Reno) are loss-based: they increase
#      sending rate until packets are dropped, then back off. This leads
#      to the "sawtooth" pattern of throughput oscillation and fills router
#      buffers (bufferbloat), increasing latency.
#    - BBR (developed by Google) is model-based: it continuously estimates
#      the bottleneck bandwidth and minimum RTT of the connection, then
#      paces packets to match the actual available bandwidth without
#      filling intermediate buffers.
#
#  BBR advantages for gaming:
#    - Lower latency: BBR avoids filling router buffers, keeping RTT
#      close to the physical minimum. This means lower ping times in
#      online games (typically 5-20ms improvement on bufferbloated links).
#    - Stable throughput: No sawtooth oscillation means smoother game
#      asset downloads and streaming.
#    - Loss resilience: BBR does not interpret packet loss as congestion
#      (unlike Cubic), making it more robust on WiFi and congested
#      networks — common scenarios for laptop gaming.
#    - Better WiFi performance: Particularly beneficial on the HP Victus
#      15's WiFi 6E (MediaTek MT7922) where random packet loss from
#      wireless interference is common.
#
#  Requirements:
#    - Kernel 4.9+ for BBR v1 (all modern kernels support this)
#    - Kernel 6.x+ for BBR v2/v3 (improved fairness and performance)
#    - Works best with FQ qdisc (configured above)
#    - The tcp_bbr kernel module must be available (included in DevShakti's
#      kernel configuration)
#
#  Note: BBR affects outgoing TCP connections. Incoming connections from
#  game servers use their own congestion control. However, game downloads,
#  voice chat uploads, and Proton/Wine network traffic all benefit.
#
#  Performance impact: Measurably lower latency and higher throughput on
#  most real-world network paths. No downside for gaming workloads.
# ---------------------------------------------------------------------------
net.ipv4.tcp_congestion_control = bbr


# ============================================================================
#  End of Gaming & Performance kernel parameters for DevShakti OS
#
#  Verification:
#    $ sysctl vm.max_map_count vm.swappiness net.core.default_qdisc \
#            net.ipv4.tcp_congestion_control
#    Expected output:
#      vm.max_map_count = 2147483642
#      vm.swappiness = 10
#      net.core.default_qdisc = fq
#      net.ipv4.tcp_congestion_control = bbr
