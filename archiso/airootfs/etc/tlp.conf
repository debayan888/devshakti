# ============================================================================
#  DevShakti OS — TLP Power Management Configuration
#  /etc/tlp.conf
# ============================================================================
#
#  Hardware Target : HP Victus 15
#  CPU             : AMD Ryzen 7 7445HS (Zen 4, 8C/16T, 35-54W)
#  iGPU            : AMD Radeon 760M (RDNA 3)
#  dGPU            : NVIDIA GeForce RTX 4050 Laptop (Ada Lovelace)
#  RAM             : 16 GB DDR5-4800
#  Battery         : 75 Wh Li-ion
#  TLP Version     : 1.6+
#
#  Philosophy:
#    AC   → Unleash full performance; the machine is plugged in.
#    BAT  → Aggressively conserve power for maximum battery life.
#
#  All parameters are documented inline.  Values ending in _AC apply when
#  on mains power; values ending in _BAT apply on battery.
#
#  Docs: https://linrunner.de/tlp/settings/
# ============================================================================

# ----------------------------------------------------------------------------
#  Section 1 — TLP Operation
# ----------------------------------------------------------------------------

# Enable TLP power management (1 = enabled, 0 = disabled).
TLP_ENABLE=1

# Default TLP operating mode when no power source is detected.
# Possible values: AC, BAT
TLP_DEFAULT_MODE=AC

# Seconds to wait before applying settings after boot/resume.
# Allows the system to stabilize before power policy is applied.
TLP_PERSISTENT_DEFAULT=0

# Operation mode override — leave empty to auto-detect from power supply.
# Set to "AC" or "BAT" to force a mode regardless of charger state.
# TLP_PS_IGNORE=

# ----------------------------------------------------------------------------
#  Section 2 — CPU Settings
# ----------------------------------------------------------------------------

# CPU frequency scaling governor.
#   performance  — run at max frequency (AC)
#   powersave    — let the kernel scale down aggressively (BAT)
CPU_SCALING_GOVERNOR_ON_AC=performance
CPU_SCALING_GOVERNOR_ON_BAT=powersave

# CPU frequency scaling driver.
# amd-pstate-epp is the recommended driver for Zen 4 processors.
# It provides the best integration with AMD's power management.
CPU_DRIVER_OPMODE_ON_AC=active
CPU_DRIVER_OPMODE_ON_BAT=active

# Intel/AMD CPU Energy Performance Preference (EPP).
# Controls the hardware-level energy vs. performance trade-off.
# For amd-pstate-epp driver on Zen 4:
#   performance      — maximum performance, higher power draw
#   balance_performance — slight power savings
#   balance_power    — favor power savings over performance
#   power            — maximum power savings
CPU_ENERGY_PERF_POLICY_ON_AC=performance
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power

# CPU frequency limits (in kHz).
# The Ryzen 7 7445HS base is 3.3 GHz, boost up to 5.15 GHz.
# Leave commented to use BIOS-defined limits.
# CPU_SCALING_MIN_FREQ_ON_AC=0
# CPU_SCALING_MAX_FREQ_ON_AC=0
# CPU_SCALING_MIN_FREQ_ON_BAT=0
# CPU_SCALING_MAX_FREQ_ON_BAT=0

# CPU turbo boost (0 = enabled, 1 = disabled).
# On AC, enable boost for maximum single-threaded performance.
# On BAT, disable boost to reduce heat and power draw significantly.
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0

# Hyper-Threading / SMT control (on = enabled, off = disabled).
# Keep SMT enabled always — Zen 4 SMT is efficient.
CPU_HWP_DYN_BOOST_ON_AC=1
CPU_HWP_DYN_BOOST_ON_BAT=0

# Minimum and maximum number of CPU cores online.
# Leave commented to keep all 8 cores active at all times.
# On battery, the governor + EPP handles frequency scaling; core parking
# is handled by the kernel scheduler and amd-pstate driver.
# CPU_MIN_PERF_ON_AC=0
# CPU_MAX_PERF_ON_AC=100
# CPU_MIN_PERF_ON_BAT=0
# CPU_MAX_PERF_ON_BAT=30

# AMD Pstate minimum/maximum performance percentage.
# These control the pstate driver's performance range.
# On AC: allow full range.
# On BAT: constrain to save power.
CPU_MIN_PERF_ON_AC=0
CPU_MAX_PERF_ON_AC=100
CPU_MIN_PERF_ON_BAT=0
CPU_MAX_PERF_ON_BAT=60

# ----------------------------------------------------------------------------
#  Section 3 — Platform Profile (ACPI)
# ----------------------------------------------------------------------------

# ACPI platform profile for modern AMD laptops.
# Controls the overall thermal/performance envelope.
#   performance — full fan speed, max TDP
#   balanced    — balanced TDP
#   low-power   — reduced TDP, quiet fans
PLATFORM_PROFILE_ON_AC=performance
PLATFORM_PROFILE_ON_BAT=low-power

# ----------------------------------------------------------------------------
#  Section 4 — GPU Settings
# ----------------------------------------------------------------------------

# AMD Radeon iGPU power profile level.
#   auto    — let the driver decide
#   low     — force lowest power state
#   high    — force highest performance state
RADEON_POWER_PROFILE_ON_AC=high
RADEON_POWER_PROFILE_ON_BAT=low

# AMD Radeon DPM (Dynamic Power Management) state.
#   performance — high clocks
#   battery     — low clocks, power saving
#   balanced    — moderate clocks
RADEON_DPM_STATE_ON_AC=performance
RADEON_DPM_STATE_ON_BAT=battery

# AMD Radeon DPM performance level.
#   auto    — driver managed
#   low     — force low
#   high    — force high
RADEON_DPM_PERF_LEVEL_ON_AC=auto
RADEON_DPM_PERF_LEVEL_ON_BAT=low

# AMDGPU ABM (Adaptive Backlight Management) level.
# 0 = off, 1-4 = increasing levels of backlight optimization.
# Higher values save more power but may alter color accuracy.
AMDGPU_ABM_LEVEL_ON_AC=0
AMDGPU_ABM_LEVEL_ON_BAT=3

# ----------------------------------------------------------------------------
#  Section 5 — NVMe / Disk Settings
# ----------------------------------------------------------------------------

# AHCI link power management (SATA).
#   max_performance       — no link power management
#   med_power_with_dipm   — moderate savings with device-initiated PM
#   min_power             — maximum power savings (risk of latency)
SATA_LINKPWR_ON_AC=max_performance
SATA_LINKPWR_ON_BAT=med_power_with_dipm

# NVMe Active Power Management (APM).
# Not all NVMe drives support APM; this is safe to set regardless.
# On AC: disabled (254 = no APM) for maximum throughput.
# On BAT: enabled (128 = moderate savings) to reduce idle power.
DISK_APM_LEVEL_ON_AC="254"
DISK_APM_LEVEL_ON_BAT="128"

# Hard disk spindown timeout (in seconds, 0 = disabled).
# Not typically relevant for NVMe-only systems, but included for
# completeness if an external HDD is attached.
DISK_SPINDOWN_TIMEOUT_ON_AC="0"
DISK_SPINDOWN_TIMEOUT_ON_BAT="120"

# I/O scheduler per disk device.
# For NVMe: none (passthrough) is optimal.
# DISK_IOSCHED="none"

# Disk devices to manage (space-separated).
# Auto-detected if left empty.
# DISK_DEVICES="nvme0n1"

# Advanced Power Management for NVMe.
# Enable APST (Autonomous Power State Transitions) on battery.
# AHCI_RUNTIME_PM_ON_AC=on
# AHCI_RUNTIME_PM_ON_BAT=auto
# AHCI_RUNTIME_PM_TIMEOUT=15

# ----------------------------------------------------------------------------
#  Section 6 — PCIe Power Management
# ----------------------------------------------------------------------------

# PCIe Active State Power Management (ASPM).
#   default         — use BIOS defaults
#   performance     — disable ASPM for maximum throughput
#   powersave       — L0s + L1
#   powersupersave  — L0s + L1 + L1.1 + L1.2 (deepest savings)
PCIE_ASPM_ON_AC=performance
PCIE_ASPM_ON_BAT=powersupersave

# Runtime Power Management for PCI(e) devices.
#   on  = disable Runtime PM (device always active)
#   auto = enable Runtime PM (device can suspend)
RUNTIME_PM_ON_AC=on
RUNTIME_PM_ON_BAT=auto

# Runtime PM driver denylist — devices that should NEVER be suspended.
# The NVIDIA RTX 4050 should remain active on AC for performance.
# Use lspci to find the PCI address of the NVIDIA GPU and add here.
# Example: RUNTIME_PM_DRIVER_DENYLIST="nouveau nvidia"
RUNTIME_PM_DRIVER_DENYLIST="nvidia"

# Runtime PM device denylist — PCI addresses to exclude from Runtime PM.
# Uncomment and set if NVIDIA GPU has specific PCI address issues.
# Find via: lspci -nn | grep -i nvidia
# RUNTIME_PM_DENYLIST=""

# Runtime PM device allowlist — if set, ONLY these addresses get Runtime PM.
# Leave empty to manage all devices.
# RUNTIME_PM_ALLOWLIST=""

# Timeout (seconds) before a PCI device enters runtime suspend.
RUNTIME_PM_TIMEOUT=15

# ----------------------------------------------------------------------------
#  Section 7 — USB Autosuspend
# ----------------------------------------------------------------------------

# USB autosuspend (1 = enabled, 0 = disabled).
# On AC: disabled — peripherals remain instantly responsive.
# On BAT: enabled — USB devices suspend after timeout to save power.
USB_AUTOSUSPEND=1
USB_AUTOSUSPEND_ON_AC=0
USB_AUTOSUSPEND_ON_BAT=1

# USB autosuspend timeout (seconds).
USB_AUTOSUSPEND_DISABLE_ON_SHUTDOWN=1

# USB devices to exclude from autosuspend (space-separated VID:PID).
# Always exclude HID devices (mouse, keyboard) for usability.
# Common exclusions:
#   - Input devices (mice, keyboards, gamepads)
#   - Webcams during video calls
# Use lsusb to find VID:PID pairs.
# USB_DENYLIST="1234:5678 abcd:ef01"

# Exclude specific USB device types from autosuspend.
# Categories: audio, bluetooth, btusb, cdc_acm, hid, usbhid, usbnet
USB_EXCLUDE_AUDIO=1
USB_EXCLUDE_BTUSB=1
USB_EXCLUDE_PHONE=1
USB_EXCLUDE_PRINTER=1
USB_EXCLUDE_WWAN=1

# Autosuspend for all USB HID devices (mice, keyboards, etc.).
# 0 = suspend allowed, 1 = never suspend
USB_EXCLUDE_HID=1

# ----------------------------------------------------------------------------
#  Section 8 — Wi-Fi Power Management
# ----------------------------------------------------------------------------

# Wi-Fi power saving mode (on = enabled, off = disabled).
# On AC: disabled for minimum latency in online gaming / streaming.
# On BAT: enabled to reduce wireless radio power consumption.
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on

# Disable wake-on-WLAN (Y = disable, N = keep enabled).
# Disabling WoWLAN saves power and improves security.
WOL_DISABLE=Y

# ----------------------------------------------------------------------------
#  Section 9 — Audio Power Management
# ----------------------------------------------------------------------------

# Intel HDA / AMD ACP audio power saving.
# Timeout in seconds before audio codec enters power-saving mode.
# 0 = disabled (prevents audio pops/clicks on AC).
# 1 = enable immediately on BAT for power savings.
SOUND_POWER_SAVE_ON_AC=0
SOUND_POWER_SAVE_ON_BAT=1

# Audio codec power saving controller.
# Y = enable codec power save, N = disable.
SOUND_POWER_SAVE_CONTROLLER=Y

# ----------------------------------------------------------------------------
#  Section 10 — Battery Charge Thresholds (HP Specific)
# ----------------------------------------------------------------------------

# Battery charge thresholds for battery longevity.
# Keeping the battery between 40–80% significantly extends cycle life.
# HP laptops with UEFI support may honor these via the kernel driver.
#
# START_CHARGE_THRESH: charging begins when battery drops below this %.
# STOP_CHARGE_THRESH:  charging stops when battery reaches this %.
START_CHARGE_THRESH_BAT0=40
STOP_CHARGE_THRESH_BAT0=80

# Force full charge once (set to 1 to override thresholds temporarily).
# Reset to 0 after the full charge cycle completes.
# RESTORE_THRESHOLDS_ON_BAT=1

# Secondary battery (if present — not applicable for HP Victus 15).
# START_CHARGE_THRESH_BAT1=40
# STOP_CHARGE_THRESH_BAT1=80

# ----------------------------------------------------------------------------
#  Section 11 — Processor Performance Scaling (AMD P-State)
# ----------------------------------------------------------------------------

# AMD P-State EPP preferences.
# These work with the amd_pstate=active kernel parameter.
# Values: default, performance, balance_performance, balance_power, power
CPU_ENERGY_PERF_POLICY_ON_AC=performance
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power

# AMD P-State scaling driver mode.
# active  — hardware-managed frequency scaling (recommended for Zen 4)
# passive — software-managed (cpufreq governor controls scaling)
# guided  — hardware-managed within software-defined limits
# CPU_DRIVER_OPMODE_ON_AC=active
# CPU_DRIVER_OPMODE_ON_BAT=active

# ----------------------------------------------------------------------------
#  Section 12 — Kernel Scheduler / Workqueue Power Saving
# ----------------------------------------------------------------------------

# NMI watchdog (0 = disabled).
# Disabling saves a small amount of power and reduces timer interrupts.
NMI_WATCHDOG=0

# Kernel laptop mode (file system write-back behavior).
# 0 = disabled (AC) — immediate writes for data safety.
# 2 = enabled (BAT) — defer writes to reduce disk I/O.
DISK_IDLE_SECS_ON_AC=0
DISK_IDLE_SECS_ON_BAT=2

# Dirty page writeback parameters (seconds).
# Controls how long modified pages stay in memory before flushing to disk.
# Longer intervals on BAT reduce I/O wake-ups.
MAX_LOST_WORK_SECS_ON_AC=15
MAX_LOST_WORK_SECS_ON_BAT=60

# Kernel workqueue power saving (reduces timer frequency).
# Saves a small amount of CPU power.
# CPU_BOOST_ON_AC already controls boost; this is separate.
# SCHED_POWERSAVE_ON_AC=0
# SCHED_POWERSAVE_ON_BAT=1

# ----------------------------------------------------------------------------
#  Section 13 — Network Interface Power Management
# ----------------------------------------------------------------------------

# Ethernet Wake-on-LAN.
# Disable to save power (Y = disable, N = keep enabled).
WOL_DISABLE=Y

# Network interface power management.
# Managed by NetworkManager or systemd-networkd; TLP defers to them.
# Uncomment only if you need manual override.
# DEVICES_TO_ENABLE_ON_AC=""
# DEVICES_TO_DISABLE_ON_BAT=""
# DEVICES_TO_DISABLE_ON_BAT_NOT_IN_USE=""

# Enable/disable devices on startup.
# DEVICES_TO_ENABLE_ON_STARTUP=""
# DEVICES_TO_DISABLE_ON_STARTUP=""

# Enable/disable devices on shutdown.
# DEVICES_TO_ENABLE_ON_SHUTDOWN=""
# DEVICES_TO_DISABLE_ON_SHUTDOWN=""

# Bluetooth device management on BAT.
# Uncomment to disable Bluetooth radio on battery for extra savings.
# DEVICES_TO_DISABLE_ON_BAT="bluetooth"

# ----------------------------------------------------------------------------
#  Section 14 — Trace / Debug
# ----------------------------------------------------------------------------

# TLP debug output.
# Set to a space-separated list of categories to enable verbose logging.
# Categories: arg, bat, disk, lock, nm, path, pm, ps, rf, run, sysfs, udev
# Leave empty for production use.
TLP_DEBUG=""

# Warn if TLP detects a power management conflict (e.g., power-profiles-daemon).
TLP_WARN_LEVEL=3

# ============================================================================
#  DevShakti OS — End of TLP Configuration
# ============================================================================
#
#  Apply changes:
#    $ sudo tlp start
#
#  Check current status:
#    $ sudo tlp-stat -s
#
#  Monitor battery:
#    $ sudo tlp-stat -b
#
#  Full diagnostics:
#    $ sudo tlp-stat
#
# ============================================================================
