# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║                DevShakti OS — mkinitcpio Configuration                     ║
# ║                                                                            ║
# ║  Initial ramdisk (initramfs) generator for the Linux kernel.               ║
# ║  Optimized for HP Victus 15 — Ryzen 7 7445HS + RTX 4050 + Radeon 760M     ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# After editing, regenerate all initramfs images:
#   sudo mkinitcpio -P
#
# Reference: mkinitcpio(8), mkinitcpio.conf(5)
# ──────────────────────────────────────────────────────────────────────────────


# ── MODULES ──────────────────────────────────────────────────────────────────
# Kernel modules to load BEFORE any hooks run. Use this for modules critical
# to early boot that cannot be auto-detected (e.g., GPU drivers for KMS).
#
#   nvidia           — NVIDIA proprietary kernel module (RTX 4050)
#   nvidia_modeset   — NVIDIA kernel modesetting support (required for Wayland)
#   nvidia_uvm       — NVIDIA Unified Virtual Memory (CUDA / compute)
#   nvidia_drm       — NVIDIA Direct Rendering Manager (DRM/KMS integration)
#   amdgpu           — AMD GPU kernel module (Radeon 760M iGPU)
#
# Including both GPU drivers ensures seamless hybrid graphics from the very
# first frame, eliminating any TTY flickering during boot.
MODULES=(nvidia nvidia_modeset nvidia_uvm nvidia_drm amdgpu)


# ── BINARIES ─────────────────────────────────────────────────────────────────
# Additional binaries to include in the initramfs image. These are available
# in the early userspace emergency shell for recovery purposes.
# Most users can leave this empty.
BINARIES=()


# ── FILES ────────────────────────────────────────────────────────────────────
# Additional files to include in the initramfs image. Useful for firmware
# blobs or custom scripts needed before root is mounted.
# Most users can leave this empty.
FILES=()


# ── HOOKS ────────────────────────────────────────────────────────────────────
# Hooks are executed in ORDER. Each hook adds scripts and/or modules to the
# initramfs. Changing the order can break boot — edit carefully.
#
# Hook descriptions:
#   base          — Essential initramfs utilities (busybox, init)
#   udev          — Systemd-udev device manager for dynamic /dev population
#   plymouth      — Graphical boot splash (DevShakti branded splash screen)
#                   ⚠ Must come AFTER udev and BEFORE encrypt/filesystems
#   autodetect    — Scans running system to include only needed modules
#                   (reduces initramfs size; remove for portable images)
#   microcode     — Loads AMD CPU microcode updates at earliest boot stage
#                   (critical for Ryzen 7 7445HS stability & security patches)
#   modconf       — Loads module configuration from /etc/modprobe.d/
#   kms           — Enables early Kernel Mode Setting for flicker-free boot
#                   (works with both amdgpu and nvidia_drm)
#   keyboard      — Keyboard driver support (USB + PS/2)
#   keymap        — Loads the console keymap from /etc/vconsole.conf
#   consolefont   — Loads the console font from /etc/vconsole.conf
#   block         — Block device modules (SATA, NVMe, USB storage, virtio)
#   filesystems   — Filesystem modules (ext4, btrfs, xfs, vfat, ntfs3, etc.)
#   fsck          — Filesystem check utilities (runs fsck on root if needed)
#
HOOKS=(base udev plymouth autodetect microcode modconf kms keyboard keymap consolefont block filesystems fsck)


# ── COMPRESSION ──────────────────────────────────────────────────────────────
# Algorithm used to compress the initramfs image.
# Options: gzip, bzip2, lz4, lzma, lzop, xz, zstd
#
# zstd offers the best balance of compression ratio and decompression speed,
# significantly reducing boot time compared to gzip/xz on NVMe storage.
#COMPRESSION="zstd"

# Compression-specific options (passed to the compressor binary).
# For zstd, -T0 uses all CPU threads; compression levels range from 1-19.
#COMPRESSION_OPTIONS=(-T0 -3)


# ── MODULES_DECOMPRESS ──────────────────────────────────────────────────────
# Controls whether modules are decompressed before being included.
# "yes" — decompress modules (faster modprobe, larger initramfs)
# "no"  — keep modules compressed (smaller initramfs, slightly slower boot)
#MODULES_DECOMPRESS="yes"
