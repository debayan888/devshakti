# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║                        DevShakti OS — Locale Configuration                 ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# This file sets the system-wide locale. It is read by systemd at early boot
# and defines the default language, character encoding, and formatting for all
# programs that respect the LANG / LC_* environment variables.
#
# To override individual categories (date format, currency, collation, etc.),
# add the corresponding LC_* variable below. For example:
#   LC_TIME=en_GB.UTF-8      — Use day/month/year date format
#   LC_MONETARY=en_IN.UTF-8  — Use Indian rupee formatting
#   LC_NUMERIC=en_US.UTF-8   — Use period as decimal separator
#
# After changing this file, regenerate the locale cache:
#   sudo locale-gen
#   sudo localectl set-locale LANG=en_US.UTF-8
#
# Reference: locale(7), localectl(1), locale.conf(5)
# ──────────────────────────────────────────────────────────────────────────────

LANG=en_US.UTF-8
