# ============================================================================
#  DevShakti OS — AMD Radeon 760M Integrated GPU Configuration
#  Target Hardware: HP Victus 15 (AMD Ryzen 7 7445HS with Radeon 760M iGPU)
# ============================================================================
#
#  This file configures the amdgpu kernel module for the AMD Radeon 760M
#  integrated graphics processor (RDNA 3, GFX1103/Phoenix APU).
#
#  The Radeon 760M serves as the primary display GPU in DevShakti's Optimus
#  (PRIME) configuration. It handles:
#    - Desktop compositing (KDE Plasma 6 / Wayland or X11)
#    - Video decoding (VA-API hardware acceleration)
#    - Lightweight gaming and general 3D rendering
#    - Display output to the laptop's built-in panel and external monitors
#
#  The NVIDIA RTX 4050 dGPU is configured separately for offload rendering.
#
#  File: /etc/modprobe.d/amdgpu.conf
#  Loaded by: modprobe when the amdgpu kernel module is inserted.
# ============================================================================

# ---------------------------------------------------------------------------
#  amdgpu ppfeaturemask=0xffffffff
# ---------------------------------------------------------------------------
#  Unlocks all PowerPlay (power management) features in the amdgpu driver.
#
#  What it does:
#    - The amdgpu driver uses a bitmask called "ppfeaturemask" to control
#      which power management and performance tuning features are exposed
#      to userspace via sysfs (/sys/class/drm/card*/device/pp_*).
#    - Setting this to 0xffffffff (all bits set) enables every available
#      PowerPlay feature, including:
#
#      Bit 0  (0x001) — Performance level control (pp_dpm_sclk, pp_dpm_mclk)
#      Bit 1  (0x002) — Power profiling modes (pp_power_profile_mode)
#      Bit 2  (0x004) — Fan curve control (pp_fan_curve, manual fan speed)
#      Bit 3  (0x008) — Thermal throttling configuration
#      Bit 4  (0x010) — Voltage/frequency curve (pp_od_clk_voltage)
#                        Allows GPU overclocking and undervolting
#      Bit 5  (0x020) — Power limit control (hwmon power1_cap)
#      Bit 6  (0x040) — UVD/VCN (video decode) power gating
#      Bit 7  (0x080) — SMC (System Management Controller) features
#      Bit 8  (0x100) — GFXOFF (GFX power gating for idle power savings)
#      Bit 9+ (0x200+) — Additional vendor-specific power features
#
#  Why it matters for DevShakti:
#    - Enables tools like CoreCtrl, TuxClocker, and custom scripts to
#      monitor and tune the Radeon 760M's power behavior.
#    - Allows users to set custom power profiles for gaming vs. battery:
#        echo "manual" > /sys/class/drm/card0/device/power_dpm_force_performance_level
#        echo "1" > /sys/class/drm/card0/device/pp_dpm_sclk  # Lock to low clock
#    - Required for undervolting on supported APUs to reduce heat and
#      extend battery life without sacrificing performance.
#    - On the Ryzen 7 7445HS's integrated Radeon 760M, this primarily
#      enables GFXOFF (deep idle power gating) and DPM level control.
#
#  Security note:
#    - Overclocking/undervolting requires root or appropriate sysfs
#      permissions. DevShakti ships with safe defaults; advanced tuning
#      is opt-in via the DevShakti Performance Manager.
#
#  Possible values: Any 32-bit bitmask (default varies by kernel version)
#  Recommended: 0xffffffff (unlock all features)
# ---------------------------------------------------------------------------
options amdgpu ppfeaturemask=0xffffffff

# ---------------------------------------------------------------------------
#  amdgpu dc=1
# ---------------------------------------------------------------------------
#  Enables the AMD Display Core (DC) driver.
#
#  What it does:
#    - DC (Display Core) is AMD's modern display stack that replaced the
#      legacy DAL (Display Abstraction Layer) in the amdgpu driver.
#    - It handles all display output functionality:
#        • Mode setting (resolution, refresh rate, timings)
#        • HDMI and DisplayPort protocol handling
#        • FreeSync / Adaptive Sync support
#        • HDR (High Dynamic Range) output
#        • Display link training and hotplug detection
#        • Multi-monitor configuration
#        • Hardware cursor and overlay planes
#
#  Why it matters for DevShakti:
#    - DC is required for FreeSync support on the HP Victus 15's panel
#      (if the panel supports variable refresh rate).
#    - Provides proper EDID parsing and display mode selection for the
#      laptop's built-in 1920x1080 (or 2560x1440) IPS panel.
#    - Required for Wayland compositors (KDE Plasma 6 Wayland) to properly
#      enumerate and configure displays through the DRM/KMS interface.
#    - Enables hardware cursor planes, reducing compositor overhead.
#    - Supports HDR passthrough for gaming on external HDR monitors.
#
#  Note: On modern kernels (5.x+) and RDNA/RDNA2/RDNA3 GPUs, DC is
#  enabled by default. This explicit setting ensures it remains active
#  even if kernel defaults change in future updates.
#
#  Possible values: 0 (disabled, legacy DAL), 1 (enabled, DC)
#  Recommended: 1 (mandatory for RDNA 3 / Radeon 760M)
# ---------------------------------------------------------------------------
options amdgpu dc=1

# ---------------------------------------------------------------------------
#  amdgpu dpm=1
# ---------------------------------------------------------------------------
#  Enables Dynamic Power Management (DPM) for the GPU.
#
#  What it does:
#    - DPM dynamically adjusts the GPU's clock speeds (shader clock,
#      memory clock) and voltage levels based on real-time workload demand.
#    - When idle (desktop, text editing), the GPU clocks down to minimum
#      frequencies (~200-400 MHz shader, ~400 MHz memory on Radeon 760M)
#      and reduces voltage, dramatically lowering power consumption.
#    - Under load (gaming, 3D rendering, video playback), the GPU ramps
#      up to its boost clocks (~2600 MHz shader on Radeon 760M) for
#      maximum performance.
#    - DPM operates through multiple performance states (DPM levels):
#        Level 0: Minimum clocks (ultra-low power, idle)
#        Level 1: Intermediate clocks (light workloads)
#        Level 2: Maximum clocks (full performance, gaming)
#
#  Why it matters for DevShakti:
#    - Critical for laptop battery life. Without DPM, the Radeon 760M
#      runs at fixed (often maximum) clocks, wasting power and generating
#      unnecessary heat.
#    - The Ryzen 7 7445HS APU shares its power budget (45W-54W TDP)
#      between the CPU cores and the iGPU. DPM ensures the iGPU releases
#      power headroom back to the CPU when GPU load is light, improving
#      overall system responsiveness.
#    - Works in conjunction with ppfeaturemask to allow userspace tools
#      to query and control DPM levels via sysfs.
#    - Essential for thermal management — prevents the APU from thermal
#      throttling under sustained mixed CPU+GPU workloads.
#
#  Note: DPM is enabled by default on most modern kernels, but this
#  explicit setting ensures consistent behavior across kernel updates.
#
#  Possible values: 0 (disabled, static clocks), 1 (enabled, dynamic)
#  Recommended: 1 (always enable on laptops)
# ---------------------------------------------------------------------------
options amdgpu dpm=1

# ============================================================================
#  End of AMD Radeon 760M configuration for DevShakti OS
#  See also:
#    /etc/modprobe.d/nvidia.conf           — NVIDIA RTX 4050 dGPU config
#    /etc/X11/xorg.conf.d/10-optimus.conf  — PRIME offloading Xorg config
#    /etc/sysctl.d/80-gamecompat.conf      — Gaming kernel parameters
# ============================================================================
