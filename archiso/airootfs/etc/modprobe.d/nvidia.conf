# ============================================================================
#  DevShakti OS — NVIDIA RTX 4050 Laptop GPU Configuration
#  Target Hardware: HP Victus 15 (NVIDIA GeForce RTX 4050 Laptop GPU)
# ============================================================================
#
#  This file configures the proprietary NVIDIA kernel modules for optimal
#  performance, power management, and Wayland/X11 compatibility on the
#  HP Victus 15 laptop equipped with an RTX 4050 (Ada Lovelace, AD107).
#
#  The RTX 4050 operates as the discrete GPU (dGPU) in an Optimus/PRIME
#  configuration alongside the AMD Radeon 760M integrated GPU (iGPU).
#
#  File: /etc/modprobe.d/nvidia.conf
#  Loaded by: modprobe when the nvidia, nvidia_drm, or nvidia_modeset
#             kernel modules are inserted.
# ============================================================================

# ---------------------------------------------------------------------------
#  nvidia_drm modeset=1
# ---------------------------------------------------------------------------
#  Enables kernel modesetting (KMS) for the NVIDIA DRM driver.
#
#  What it does:
#    - Allows the NVIDIA driver to take over display mode management at the
#      kernel level, rather than relying on userspace (X11/Wayland) alone.
#    - Required for Wayland compositors (KDE Plasma Wayland, GNOME Wayland,
#      Hyprland, Sway, etc.) to function with NVIDIA GPUs.
#    - Enables seamless VT (virtual terminal) switching without screen
#      corruption or flickering.
#    - Required for proper PRIME offloading and reverse PRIME when used
#      alongside the AMD iGPU.
#
#  Why it matters for DevShakti:
#    - DevShakti OS targets KDE Plasma 6 with Wayland as the default session.
#    - Without KMS, the compositor cannot acquire DRM resources from the
#      NVIDIA GPU, resulting in a black screen or fallback to X11.
#    - Also needed for proper suspend/resume behavior on laptops.
#
#  Possible values: 0 (disabled, default), 1 (enabled)
#  Recommended: 1 (mandatory for modern desktop environments)
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
#  nvidia_drm fbdev=1
# ---------------------------------------------------------------------------
#  Enables the NVIDIA framebuffer device (/dev/fb*) via DRM.
#
#  What it does:
#    - Provides a kernel-level framebuffer console on the NVIDIA GPU,
#      replacing the generic VESA/EFI framebuffer with an NVIDIA-accelerated
#      one.
#    - Allows the boot splash (Plymouth), TTY consoles, and early-boot
#      graphics to render at the native panel resolution with proper scaling.
#    - Prevents the common issue where switching to a TTY (Ctrl+Alt+F2)
#      shows a garbled or blank screen on NVIDIA Optimus laptops.
#
#  Why it matters for DevShakti:
#    - Ensures the DevShakti boot splash and TTY consoles render cleanly
#      on the HP Victus 15's 1920x1080 (or 2560x1440) panel.
#    - Required on driver version 545+ for proper early KMS framebuffer.
#
#  Possible values: 0 (disabled), 1 (enabled)
#  Recommended: 1
#  Note: Requires nvidia_drm.modeset=1 to be effective.
#        Available since NVIDIA driver 545.xx and later.
# ---------------------------------------------------------------------------
options nvidia_drm modeset=1 fbdev=1

# ---------------------------------------------------------------------------
#  nvidia NVreg_UsePageAttributeTable=1
# ---------------------------------------------------------------------------
#  Enables the CPU's Page Attribute Table (PAT) for NVIDIA memory mappings.
#
#  What it does:
#    - PAT is a modern CPU feature (available on all x86_64 processors since
#      Pentium III / Athlon) that provides fine-grained control over memory
#      caching policies (write-back, write-combining, uncacheable, etc.).
#    - When enabled, the NVIDIA driver uses PAT instead of the older MTRR
#      (Memory Type Range Registers) mechanism for setting up GPU memory
#      regions with optimal caching attributes.
#    - This results in more efficient CPU-to-GPU memory transfers and
#      eliminates potential MTRR conflicts with other drivers.
#
#  Why it matters for DevShakti:
#    - The AMD Ryzen 7 7445HS fully supports PAT. Using it avoids MTRR
#      exhaustion issues (only 8 MTRR entries exist on x86_64).
#    - Improves performance in GPU-accelerated workloads: gaming (Vulkan,
#      OpenGL), video encoding (NVENC), CUDA computation, and compositing.
#    - Eliminates kernel log warnings about MTRR allocation failures.
#
#  Possible values: 0 (use MTRRs, legacy), 1 (use PAT, modern)
#  Recommended: 1 on any system with kernel 2.6.28+
# ---------------------------------------------------------------------------
options nvidia NVreg_UsePageAttributeTable=1

# ---------------------------------------------------------------------------
#  nvidia NVreg_DynamicPowerManagement=0x02
# ---------------------------------------------------------------------------
#  Controls NVIDIA's runtime power management (RTD3) for the dGPU.
#
#  What it does:
#    - Determines how aggressively the NVIDIA driver powers down the RTX 4050
#      when no application is using it (no active CUDA context, no display
#      connected through it, no Vulkan/OpenGL surfaces).
#    - This is critical for laptop battery life in an Optimus configuration
#      where the AMD iGPU handles day-to-day rendering and the dGPU should
#      sleep until explicitly invoked via PRIME offloading.
#
#  Power management modes:
#    0x00 — Disabled: The dGPU stays powered on at all times.
#                     Maximum power draw, no battery benefit.
#    0x01 — Coarse-grained: The dGPU powers down only when no applications
#                           have an open file descriptor to /dev/nvidia*.
#                           Some desktop environments keep a handle open,
#                           preventing power-off.
#    0x02 — Fine-grained (RECOMMENDED): The dGPU powers down aggressively
#                           when idle, even if an application has an open
#                           handle. The GPU re-initializes transparently
#                           when a CUDA/Vulkan/OpenGL context is created.
#                           Best balance of battery life and usability.
#
#  Why it matters for DevShakti:
#    - The HP Victus 15's RTX 4050 draws 35-115W under load. With 0x02,
#      the dGPU drops to near-zero power consumption when idle, extending
#      battery life from ~2 hours (dGPU always on) to ~5-7 hours.
#    - The AMD Radeon 760M iGPU handles desktop compositing, web browsing,
#      and video playback efficiently at ~5-15W.
#    - When a game or GPU workload is launched with PRIME offloading
#      (e.g., prime-run ./game), the dGPU wakes up transparently.
#
#  Requirements:
#    - PCIe runtime power management must be enabled in the kernel:
#      The PCI power control sysfs entry for the dGPU should be set to
#      "auto" (handled by a udev rule or systemd tmpfile in DevShakti).
#    - NVIDIA driver version 470+ (recommended 535+).
#    - Supported on Turing (RTX 20xx), Ampere (RTX 30xx), Ada Lovelace
#      (RTX 40xx), and newer architectures.
#
#  Possible values: 0x00, 0x01, 0x02
#  Recommended: 0x02 for laptops with Optimus
# ---------------------------------------------------------------------------
options nvidia NVreg_DynamicPowerManagement=0x02

# ============================================================================
#  End of NVIDIA RTX 4050 configuration for DevShakti OS
#  See also:
#    /etc/modprobe.d/amdgpu.conf          — AMD Radeon 760M iGPU config
#    /etc/X11/xorg.conf.d/10-optimus.conf — PRIME offloading Xorg config
#    /etc/sysctl.d/80-gamecompat.conf     — Gaming kernel parameters
# ============================================================================
