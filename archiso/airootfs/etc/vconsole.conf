# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║                    DevShakti OS — Virtual Console Configuration            ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# Configures the Linux virtual console (TTY) keyboard layout and font.
# Read by systemd-vconsole-setup.service at early boot.
#
# KEYMAP   — Console keymap loaded via loadkeys(1).
#            Available keymaps: /usr/share/kbd/keymaps/
#
# FONT     — Console font loaded via setfont(8).
#            Available fonts: /usr/share/kbd/consolefonts/
#            ter-v18n = Terminus 18pt, normal weight — excellent HiDPI readability
#
# FONT_MAP — Optional Unicode mapping table (usually auto-detected).
# FONT_UNIMAP — Optional explicit Unicode mapping.
#
# To apply changes without rebooting:
#   sudo systemctl restart systemd-vconsole-setup.service
#
# Reference: vconsole.conf(5), systemd-vconsole-setup.service(8)
# ──────────────────────────────────────────────────────────────────────────────

# Keyboard layout — US QWERTY
KEYMAP=us

# Console font — Terminus 18pt for crisp text on the HP Victus 15" display
FONT=ter-v18n
