# ============================================================================
#  DevShakti OS — Esync / Fsync File Descriptor Limits
#  Target: Wine, Proton, and Windows game compatibility
# ============================================================================
#
#  This file raises the per-user file descriptor (open file) limits to
#  enable Esync and Fsync — high-performance synchronization mechanisms
#  used by Wine and Valve's Proton to run Windows games on Linux.
#
#  File: /etc/security/limits.d/99-esync.conf
#  Loaded by: PAM (pam_limits.so) at login time. The "99-" prefix ensures
#             this file is loaded last, overriding any lower limits set by
#             other configuration files in limits.d/.
# ============================================================================


# ============================================================================
#  BACKGROUND: What are Esync and Fsync?
# ============================================================================
#
#  Windows games use kernel synchronization objects (Events, Semaphores,
#  Mutexes) extensively for multi-threaded rendering, audio processing,
#  asset loading, and game logic. A single modern game can create hundreds
#  to thousands of these synchronization primitives.
#
#  Traditional Wine implementation:
#    Wine's wineserver process handles all synchronization objects. Every
#    time a game thread waits on or signals a sync object, it must make
#    a round-trip to the wineserver process via Unix domain sockets.
#    This creates a bottleneck: the single-threaded wineserver becomes a
#    serialization point for all game threads, causing:
#      - High CPU overhead from context switches
#      - Increased latency (microseconds per sync operation)
#      - FPS drops in CPU-bound multi-threaded games
#      - Stuttering during heavy thread synchronization
#
#  Esync (Eventfd-based Synchronization):
#    Developed by Zeb Figura at CodeWeavers (2018). Replaces wineserver
#    sync objects with Linux eventfd file descriptors. Each Windows Event,
#    Semaphore, or Mutex is mapped to an eventfd, allowing game threads
#    to wait/signal directly in-kernel via epoll() without wineserver
#    round-trips. This eliminates the serialization bottleneck.
#
#    Impact: Esync can improve performance by 5-15% in multi-threaded
#    games and dramatically reduces stuttering in CPU-bound scenarios.
#
#    Requirement: Each sync object = one file descriptor. A game with
#    10,000 sync objects needs 10,000 file descriptors. The default
#    Linux limit (1024 soft / 4096 hard) is far too low.
#
#  Fsync (Futex-based Synchronization):
#    Developed by Zeb Figura at CodeWeavers (2019), integrated into
#    Wine 9.x+ and Proton. An evolution of Esync that uses Linux futex
#    (fast userspace mutex) operations instead of eventfd. Even more
#    efficient than Esync because:
#      - No file descriptor per sync object (uses memory addresses)
#      - Lower kernel overhead (futex is lighter than eventfd)
#      - Supports NTSTATUS return codes natively
#
#    However, Fsync requires kernel support (futex_waitv syscall,
#    available since Linux 5.16). When Fsync is not available (older
#    kernels), Proton/Wine falls back to Esync, which still needs the
#    high file descriptor limits.
#
#  Why both matter for DevShakti:
#    - DevShakti ships with kernel 6.x+ which supports Fsync natively.
#    - However, some Wine versions and older Proton builds still use
#      Esync as a fallback.
#    - Other Linux applications (databases, game servers, IDEs) also
#      benefit from higher file descriptor limits.
#    - Setting high limits is a no-cost safety net.
# ============================================================================


# ============================================================================
#  FILE DESCRIPTOR LIMITS
# ============================================================================
#
#  Format: <domain> <type> <item> <value>
#
#  Domain: "*" applies to ALL users. This is safe because:
#    - The limit only sets the MAXIMUM; processes start with lower actual
#      usage and request more as needed.
#    - No memory is allocated until file descriptors are actually opened.
#    - The kernel's own limit (fs.nr_open, default 1048576) acts as an
#      absolute ceiling.
#
#  Types:
#    - "soft": The default limit for new processes. Can be raised by the
#              process itself (via setrlimit/ulimit) up to the hard limit.
#    - "hard": The absolute maximum. Can only be raised by root.
#              Setting soft = hard means processes get the maximum
#              immediately without needing to call setrlimit.
#
#  Item: "nofile" = maximum number of open file descriptors per process.
#
#  Value: 1048576 (1M = 2^20)
#    - Matches the kernel's default fs.nr_open limit.
#    - Sufficient for the most demanding games: even the heaviest AAA
#      titles under Proton rarely exceed 100,000 file descriptors.
#    - This is the value recommended by Valve for SteamOS / Steam Deck
#      and by Lutris, ProtonDB, and other Linux gaming communities.
#    - 1M is conservative enough to prevent accidental resource exhaustion
#      from runaway processes while being high enough for any game.
# ============================================================================

# Soft limit: Default file descriptor limit for all user processes.
# Processes can use up to this many FDs without any special configuration.
# Wine/Proton will automatically use available FDs for Esync objects.
* soft nofile 1048576

# Hard limit: Maximum file descriptor limit that processes can request.
# Must be >= soft limit. Setting equal to soft means the full allocation
# is available immediately without privilege escalation.
* hard nofile 1048576


# ============================================================================
#  VERIFICATION
# ============================================================================
#
#  After logging in, verify the limits are applied:
#
#    $ ulimit -Sn    # Should show: 1048576 (soft limit)
#    $ ulimit -Hn    # Should show: 1048576 (hard limit)
#
#  To verify a running Wine/Proton process has the correct limits:
#
#    $ cat /proc/$(pidof wineserver)/limits | grep "open files"
#    Max open files    1048576    1048576    files
#
#  To check if Esync is active in a running game:
#
#    $ WINEDEBUG=+esync wine <game.exe>
#    (Look for "esync: up and running" in the output)
#
#  To check if Fsync is active (preferred over Esync):
#
#    $ PROTON_LOG=1 prime-run %command%
#    (Look for "fsync: up and running" in the Proton log)
# ============================================================================


# ============================================================================
#  NOTES
# ============================================================================
#
#  1. These limits apply per-user session. They are enforced by PAM's
#     pam_limits module, which reads this file during login (console,
#     SSH, display manager). Systemd services have separate limits
#     configured via LimitNOFILE in unit files.
#
#  2. If you need per-user limits (e.g., restricting a service account),
#     replace "*" with the specific username:
#       gameuser soft nofile 1048576
#       gameuser hard nofile 1048576
#
#  3. The kernel's absolute ceiling is controlled by:
#       $ sysctl fs.nr_open
#     Default: 1048576. Our limits cannot exceed this value.
#     To raise it: add "fs.nr_open = 2097152" to sysctl.d/.
#
#  4. Systemd user services (@.service) inherit these limits if
#     pam_limits is in the PAM stack (it is in DevShakti's default config).
#
#  See also:
#    /etc/sysctl.d/80-gamecompat.conf  — Kernel gaming parameters
#    /etc/modprobe.d/nvidia.conf       — NVIDIA GPU configuration
# ============================================================================
