# ============================================================================
#  DevShakti OS — NVIDIA PRIME Offloading / Optimus Configuration
#  Target Hardware: HP Victus 15
#    - Primary (iGPU):  AMD Radeon 760M  — PCI Bus 6:0:0
#    - Offload (dGPU):  NVIDIA RTX 4050  — PCI Bus 1:0:0
# ============================================================================
#
#  This Xorg configuration implements NVIDIA PRIME GPU offloading, where:
#    - The AMD Radeon 760M (amdgpu) drives all display outputs and handles
#      desktop compositing, web browsing, and lightweight rendering.
#    - The NVIDIA RTX 4050 acts as an offload render device, activated
#      on-demand when applications are launched with PRIME offloading.
#
#  How to use PRIME offloading:
#    - Run a game/app on the NVIDIA GPU:
#        $ prime-run <application>
#      Or set environment variables manually:
#        $ __NV_PRIME_RENDER_OFFLOAD=1 \
#          __NV_PRIME_RENDER_OFFLOAD_PROVIDER=NVIDIA-G0 \
#          __GLX_VENDOR_LIBRARY_NAME=nvidia \
#          __VK_LAYER_NV_optimus=NVIDIA_only \
#          <application>
#
#    - For Vulkan applications (most modern games via Proton/Wine):
#        $ VK_DRIVER_FILES=/usr/share/vulkan/icd.d/nvidia_icd.json \
#          prime-run <application>
#
#    - For Steam games: Set launch options to:
#        prime-run %command%
#
#  PCI Bus IDs:
#    The BusID values below are typical for the HP Victus 15 platform.
#    To verify on your specific unit, run:
#        $ lspci | grep -E "VGA|3D"
#    Expected output:
#        01:00.0 3D controller: NVIDIA Corporation AD107M [GeForce RTX 4050]
#        06:00.0 VGA compatible controller: AMD/ATI [Radeon 760M]
#    Convert the lspci hex addresses to Xorg PCI format:
#        lspci 01:00.0  →  Xorg PCI:1:0:0
#        lspci 06:00.0  →  Xorg PCI:6:0:0
#
#  File: /etc/X11/xorg.conf.d/10-optimus.conf
#  Loaded by: Xorg server at startup (files in xorg.conf.d are merged
#             in lexicographic order; "10-" ensures early loading).
#
#  Note: This file is only used when running an X11 session. Under
#  Wayland (the default for DevShakti OS), PRIME offloading is handled
#  natively by the compositor and the DRM subsystem without Xorg config.
#  This file provides X11 fallback support.
# ============================================================================


# ============================================================================
#  ServerLayout Section
# ============================================================================
#  Defines the overall display server topology: which GPU is the primary
#  display device and which is available for offloading.
#
#  "Screen 0" refers to the main display (AMD iGPU), which is the only
#  screen that outputs to the laptop panel and external monitors.
#
#  The NVIDIA GPU does not have its own Screen section because it operates
#  purely as a render offload device — it renders frames and passes them
#  to the AMD GPU for display via PRIME (DMA-BUF buffer sharing).
# ============================================================================
Section "ServerLayout"
    Identifier     "DevShakti-Optimus-Layout"

    # The AMD Radeon 760M is Screen 0 — the primary display output.
    # All monitors (internal panel + external) are driven by this GPU.
    Screen      0  "AMD-Screen" 0 0

    # Inactive tells Xorg that the NVIDIA device exists but is not a
    # display output. It will be registered as an offload provider.
    # Removed: We don't add NVIDIA as an inactive screen; the NVIDIA
    # OutputClass (below) handles provider registration automatically.

    # Allow Xorg to use other input device configurations from xorg.conf.d
    Option         "AllowNVIDIAGPUScreens"
EndSection


# ============================================================================
#  Device Section — AMD Radeon 760M (Primary / Display GPU)
# ============================================================================
#  Configures the AMD iGPU as the primary rendering and display device.
#
#  Driver "amdgpu":
#    Uses the open-source amdgpu DDX (Device Dependent X) driver, which
#    interfaces with the amdgpu kernel module and Mesa's Gallium3D stack
#    for OpenGL/Vulkan rendering.
#
#  BusID "PCI:6:0:0":
#    The PCI bus address of the Radeon 760M on the HP Victus 15.
#    This MUST match the output of `lspci | grep VGA` for the AMD GPU.
#    Format: PCI:<bus>:<device>:<function> (decimal values).
#
#  Option "TearFree":
#    Enables tear-free rendering by using the GPU's hardware page-flipping
#    mechanism. Prevents horizontal tearing artifacts during desktop use
#    and video playback without the input lag penalty of traditional VSync.
#    Uses DRI3/PRESENT for efficient buffer management.
#
#  Option "DRI" "3":
#    Enables Direct Rendering Infrastructure version 3, which provides:
#      - Buffer sharing between GPU and compositor via DMA-BUF
#      - Efficient multi-GPU support (required for PRIME offloading)
#      - Reduced copy overhead compared to DRI2
#      - Native Vulkan WSI (Window System Integration) support
# ============================================================================
Section "Device"
    Identifier     "AMD-iGPU"
    Driver         "amdgpu"
    BusID          "PCI:6:0:0"

    # Enable hardware-accelerated tear-free presentation
    Option         "TearFree"       "true"

    # Use DRI3 for optimal buffer sharing with PRIME and compositors
    Option         "DRI"            "3"

    # Enable acceleration (should be default, but explicit for clarity)
    Option         "AccelMethod"    "glamor"

    # Enable variable refresh rate (FreeSync) if the panel supports it
    Option         "VariableRefresh" "true"
EndSection


# ============================================================================
#  Screen Section — AMD Display Output
# ============================================================================
#  Binds the AMD GPU device to a screen (logical display output).
#  This is the only screen that produces visible output; the NVIDIA GPU
#  renders offscreen and passes buffers to this screen via PRIME.
#
#  DefaultDepth 24:
#    24-bit color depth (8 bits per channel RGB = 16.7 million colors).
#    Standard for modern displays. 30-bit (10bpc) HDR is handled at the
#    compositor level, not in Xorg screen configuration.
# ============================================================================
Section "Screen"
    Identifier     "AMD-Screen"
    Device         "AMD-iGPU"
    DefaultDepth   24

    SubSection "Display"
        Depth      24
        # Modes are auto-detected from EDID; no need to specify manually.
        # The HP Victus 15 panel is typically 1920x1080 @ 144Hz or
        # 2560x1440 @ 165Hz depending on the SKU.
    EndSubSection
EndSection


# ============================================================================
#  Device Section — NVIDIA RTX 4050 (Offload / Render-Only GPU)
# ============================================================================
#  Configures the NVIDIA dGPU as a PRIME render offload provider.
#
#  Driver "nvidia":
#    Uses the proprietary NVIDIA DDX driver. The nvidia kernel module
#    must be loaded (configured in /etc/modprobe.d/nvidia.conf).
#
#  BusID "PCI:1:0:0":
#    The PCI bus address of the RTX 4050 on the HP Victus 15.
#    This MUST match the output of `lspci | grep 3D` for the NVIDIA GPU.
#
#  Option "AllowEmptyInitialConfiguration":
#    Critical for Optimus laptops. Tells the NVIDIA driver that it's OK
#    to initialize even though no monitors are directly connected to the
#    dGPU. Without this, the NVIDIA driver would refuse to load because
#    it detects no display outputs (they're all routed through the iGPU).
#
#  Option "PrimaryGPU" "no":
#    Explicitly marks this GPU as NOT the primary display device.
#    The AMD iGPU is the primary; the NVIDIA GPU is offload-only.
#
#  Option "Coolbits" "28":
#    Unlocks advanced GPU tuning features in the NVIDIA control panel
#    and nvidia-settings:
#      Bit 0 (1)  — GPU overclocking (clock offset adjustment)
#      Bit 1 (2)  — Memory overclocking (memory clock offset)
#      Bit 2 (4)  — Manual fan control (set fan speed percentage)
#      Bit 3 (8)  — Thermal throttle configuration
#      Bit 4 (16) — Over-voltage control (use with extreme caution)
#    28 = 4 + 8 + 16 = fan control + thermal config + voltage
#    (Overclocking bits 0+1 excluded by default for safety;
#     users can set Coolbits to 31 for full unlock.)
# ============================================================================
Section "Device"
    Identifier     "NVIDIA-dGPU"
    Driver         "nvidia"
    BusID          "PCI:1:0:0"

    # Allow initialization without connected displays (Optimus mandatory)
    Option         "AllowEmptyInitialConfiguration"   "true"

    # This GPU is an offload provider, not the primary display
    Option         "PrimaryGPU"                       "no"

    # Unlock fan control and thermal configuration in nvidia-settings
    Option         "Coolbits"                         "28"

    # Enable PRIME render offload support
    Option         "AllowExternalGpus"                "true"
EndSection


# ============================================================================
#  OutputClass Section — NVIDIA PRIME Provider Registration
# ============================================================================
#  This section automatically registers the NVIDIA GPU as a PRIME offload
#  provider when the Xorg server starts. It matches any device using the
#  nvidia-drm kernel module and configures it for offload rendering.
#
#  This is the modern (Xorg 1.20+) way to set up PRIME offloading,
#  replacing the older xrandr --setprovideroffloadsink approach.
#
#  MatchDriver "nvidia-drm":
#    Matches the NVIDIA DRM kernel driver. Any GPU using this driver
#    will be configured as an offload source.
#
#  Option "AllowPRIMEGPUOffloading" "yes":
#    Explicitly enables PRIME GPU offloading for matched devices.
#    Applications can then request rendering on the NVIDIA GPU via
#    environment variables (__NV_PRIME_RENDER_OFFLOAD, etc.).
# ============================================================================
Section "OutputClass"
    Identifier     "NVIDIA-PRIME-Offload"
    MatchDriver    "nvidia-drm"
    Driver         "nvidia"

    # Enable PRIME render offloading
    Option         "AllowPRIMEGPUOffloading"          "yes"

    # Use the proprietary NVIDIA GLX library for offloaded applications
    Option         "PrimaryGPU"                       "no"
EndSection


# ============================================================================
#  End of NVIDIA PRIME Offloading configuration for DevShakti OS
#
#  Verification commands (run after booting into X11):
#    $ xrandr --listproviders
#      Should show two providers: AMD (source + sink) and NVIDIA (source)
#
#    $ glxinfo | grep "OpenGL renderer"
#      Should show AMD Radeon 760M (default rendering)
#
#    $ prime-run glxinfo | grep "OpenGL renderer"
#      Should show NVIDIA GeForce RTX 4050 (offloaded rendering)
#
#    $ prime-run vulkaninfo | grep "deviceName"
#      Should show NVIDIA GeForce RTX 4050
#
#  See also:
#    /etc/modprobe.d/nvidia.conf       — NVIDIA kernel module parameters
#    /etc/modprobe.d/amdgpu.conf       — AMD kernel module parameters
#    /usr/bin/prime-run                 — DevShakti PRIME launch wrapper
# ============================================================================
