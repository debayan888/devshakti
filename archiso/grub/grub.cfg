# ============================================================================
# DevShakti OS — GRUB Configuration (UEFI)
# ============================================================================
# GRUB bootloader configuration for UEFI systems.
# Used when booting the DevShakti OS live ISO on UEFI hardware.
#
# Copyright (c) 2026 DevShakti Project
# SPDX-License-Identifier: MIT
# ============================================================================

# --- Defaults ----------------------------------------------------------------
set default="devshakti"
set timeout=5
set timeout_style=menu

# --- Locale & Graphics -------------------------------------------------------
insmod all_video
insmod gfxterm
insmod gfxmenu
insmod png

# Set graphical terminal for boot menu
terminal_input console
terminal_output gfxterm

# High-resolution mode for modern displays
set gfxmode=auto
loadfont unicode

# --- Color Theme (DevShakti branded) ----------------------------------------
set color_normal=light-cyan/black
set color_highlight=white/dark-gray
set menu_color_normal=light-cyan/black
set menu_color_highlight=white/dark-gray

# --- Helper: Search for the ISO label ----------------------------------------
# Dynamically find the boot partition by label
search --no-floppy --set=root --label DEVSHAKTI_%ARCHISO_LABEL%

# ============================================================================
# Boot Entries
# ============================================================================

menuentry "🔱 DevShakti OS (Live)" --class arch --class linux --id devshakti {
    set gfxpayload=keep
    linux /arch/boot/x86_64/vmlinuz-linux-zen \
        archisobasedir=arch \
        archisolabel=DEVSHAKTI_%ARCHISO_LABEL% \
        quiet splash \
        cow_spacesize=2G \
        nvidia-drm.modeset=1 \
        amd_pstate=active
    initrd /arch/boot/amd-ucode.img /arch/boot/x86_64/initramfs-linux-zen.img
}

menuentry "DevShakti OS (NVIDIA dGPU Only)" --class nvidia --class linux --id devshakti-nvidia {
    set gfxpayload=keep
    linux /arch/boot/x86_64/vmlinuz-linux-zen \
        archisobasedir=arch \
        archisolabel=DEVSHAKTI_%ARCHISO_LABEL% \
        quiet splash \
        cow_spacesize=2G \
        nvidia-drm.modeset=1 \
        amd_pstate=active \
        modprobe.blacklist=amdgpu
    initrd /arch/boot/amd-ucode.img /arch/boot/x86_64/initramfs-linux-zen.img
}

menuentry "DevShakti OS (Safe Mode — No GPU Acceleration)" --class recovery --id devshakti-safe {
    set gfxpayload=keep
    linux /arch/boot/x86_64/vmlinuz-linux-zen \
        archisobasedir=arch \
        archisolabel=DEVSHAKTI_%ARCHISO_LABEL% \
        nomodeset \
        cow_spacesize=2G
    initrd /arch/boot/amd-ucode.img /arch/boot/x86_64/initramfs-linux-zen.img
}

menuentry "DevShakti OS (Verbose — Debug Boot)" --class debug --id devshakti-verbose {
    set gfxpayload=keep
    linux /arch/boot/x86_64/vmlinuz-linux-zen \
        archisobasedir=arch \
        archisolabel=DEVSHAKTI_%ARCHISO_LABEL% \
        cow_spacesize=2G \
        nvidia-drm.modeset=1 \
        amd_pstate=active \
        loglevel=7
    initrd /arch/boot/amd-ucode.img /arch/boot/x86_64/initramfs-linux-zen.img
}

# --- Utilities ---------------------------------------------------------------

menuentry "Run Memtest86+ (Memory Test)" --class memtest --id memtest {
    set gfxpayload=keep
    linux /boot/memtest86+/memtest.efi
}

menuentry "UEFI Firmware Settings" --class efi --id firmware {
    fwsetup
}

menuentry "Reboot" --class restart --id reboot {
    reboot
}

menuentry "Power Off" --class shutdown --id poweroff {
    halt
}
