# ============================================================================
# DevShakti OS — pacman.conf (Build-Time Configuration)
# ============================================================================
# This pacman configuration is used DURING the ISO build process by mkarchiso.
# It defines which repositories to pull packages from when populating the
# airootfs (the live filesystem embedded in the ISO).
#
# NOTE: This is NOT the pacman.conf that will be installed on the target
# system — that should be placed in airootfs/etc/pacman.conf separately.
#
# Copyright (c) 2026 DevShakti Project
# SPDX-License-Identifier: MIT
# ============================================================================

# ─── General Options ─────────────────────────────────────────────────────────
[options]
# Require package signatures; database signatures are optional.
# This provides a good balance of security without breaking unsigned custom repos.
SigLevel = Required DatabaseOptional

# Target architecture. "auto" detects from the running system.
Architecture = x86_64 auto

# --- Visual & Performance ---
# Colorized output for readability
Color

# Show old and new package versions during upgrades
VerbosePkgLists

# Download up to 5 packages in parallel to speed up the build
ParallelDownloads = 5

# Check available disk space before installing packages
CheckSpace

# ─── Official Repositories ───────────────────────────────────────────────────
# These repositories are provided by the Arch Linux project.
# Mirror list is managed by reflector and stored at /etc/pacman.d/mirrorlist.

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# ─── Multilib Repository ────────────────────────────────────────────────────
# Contains 32-bit libraries needed for:
#   - Wine/Proton (Windows game compatibility)
#   - Steam (32-bit runtime)
#   - lib32-mesa, lib32-nvidia-utils, lib32-vulkan-radeon, etc.
# This MUST be enabled for gaming support.
[multilib]
Include = /etc/pacman.d/mirrorlist

# ─── DevShakti Custom Repository (AUR Packages) ─────────────────────────────
# This section is automatically activated by build.sh when AUR packages are
# built successfully. It points to the local repository containing pre-built
# AUR packages (WhiteSur themes, Heroic Games Launcher, ProtonUp-Qt, etc.)
#
# During the build, build.sh will:
#   1. Clone and build each AUR package
#   2. Place the .pkg.tar.zst files in the local repo directory
#   3. Run repo-add to create the database
#   4. Uncomment this section and set the correct Server path
#
# To manually activate, uncomment the three lines below and set the Server
# path to your local repo directory.

#[devshakti]
#SigLevel = Optional TrustAll
#Server = file:///tmp/devshakti-build/aur-repo
